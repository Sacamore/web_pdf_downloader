<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Web PDF Downloader</title>
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }
    
    .status {
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      background-color: #e3f2fd;
      color: #1976d2;
      font-size: 14px;
    }
    
    .pdf-list {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 15px;
    }
    
    .pdf-item {
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: #fff;
    }
    
    .pdf-item:hover {
      background-color: #f5f5f5;
      cursor: pointer;
    }
    
    .pdf-url {
      font-size: 12px;
      color: #666;
      word-break: break-all;
      margin-bottom: 5px;
    }
    
    .download-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }
    
    .download-btn:hover {
      background-color: #45a049;
    }
    
    .download-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    
    .scan-btn {
      background-color: #2196F3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      margin-bottom: 10px;
    }
    
    .scan-btn:hover {
      background-color: #0b7dda;
    }
    
    .no-pdfs {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>🔍 Web PDF Downloader</h1>
  
  <button id="scanBtn" class="scan-btn">Scan for PDFs</button>
  
  <div id="status" class="status" style="display: none;">
    Scanning current page...
  </div>
  
  <div id="pdfList" class="pdf-list"></div>
  
  <script src="popup.js"></script>
</body>
</html>
